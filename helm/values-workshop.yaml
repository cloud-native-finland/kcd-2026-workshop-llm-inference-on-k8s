# vLLM Production Stack — workshop values for ONE attendee group.
#
# The workshop runs on a GKE Autopilot cluster with cluster-wide:
#   - GMP managed Prometheus (auto-app-monitoring, scope=ALL)
#   - GMP query frontend in `monitoring`
#   - Grafana in `monitoring` (datasource = GMP frontend, sidecar
#     watching all namespaces for `grafana_dashboard: "1"` ConfigMaps)
#   - KEDA controller in `keda`
#   - Stackdriver Adapter exposing GMP metrics as custom.metrics.k8s.io
#
# Model weights (Qwen/Qwen3-0.6B, ~1.2 GiB, public) are pulled directly
# from HuggingFace Hub at pod startup. Cold-start adds ~30–60s per pod
# vs. the bucket approach, but avoids per-project bucket setup.
#
# Install (replace $MY_NAMESPACE with the namespace your group was assigned):
#   helm install vllm vllm/vllm-stack -n $MY_NAMESPACE -f helm/values-workshop.yaml
#
# Note on sharing: the workshop cluster has ONE physical L4 GPU, time-sliced
# 8 ways. Up to 8 engine pods (yours + everyone else's) can land on it. Each
# pod reserves ~3.6 GiB VRAM (gpuMemoryUtilization=0.15 of 24 GiB), enough
# for Qwen3-0.6B weights + KV cache for the workshop's request volume.

servingEngineSpec:
  # Autopilot rejects custom runtime classes.
  runtimeClassName: ""

  modelSpec:
    - name: "qwen3"
      enabled: true
      runtimeClassName: ""
      repository: "vllm/vllm-openai"
      tag: "v0.19.1"
      modelURL: "Qwen/Qwen3-0.6B"

      replicaCount: 1

      # Sized to fit alongside ~7 other engines on one g2-standard-12
      # (12 vCPU, 48 GiB). 500m CPU / 2 GiB RAM is plenty for Qwen3-0.6B
      # steady-state (token encode/decode + scheduling).
      requestCPU: 500m
      requestMemory: "2Gi"
      requestGPU: 1
      requestGPUType: "nvidia.com/gpu"

      # ComputeClass selects the Spot L4 pool (defined in the infra repo
      # as `vllm-gpu-l4-spot`). GPU time-sharing config — strategy + max
      # clients — lives in the ComputeClass, NOT on the pod. Autopilot's
      # autoprovisioner reads the sharing config from the ComputeClass
      # and labels the new node accordingly; Pods that try to also
      # select `cloud.google.com/gke-gpu-sharing-strategy` themselves
      # blow up with `Pod didn't trigger scale-up` because the
      # autoprovisioner won't manifest a node labeled that way unless
      # the ComputeClass says so.
      nodeSelectorTerms:
        - matchExpressions:
            - key: cloud.google.com/compute-class
              operator: In
              values: [vllm-gpu-l4-spot]

      vllmConfig:
        v0: "0"
        enablePrefixCaching: true
        enableChunkedPrefill: true
        maxModelLen: 8192
        dtype: "bfloat16"
        tensorParallelSize: 1
        # 8 × 0.15 = 1.2 of L4 24 GiB. Oversubscribed on paper, but
        # Qwen3-0.6B's actual VRAM footprint is well under 3 GiB even with
        # KV cache, so the math works out at workshop request volumes.
        gpuMemoryUtilization: 0.15
        extraArgs: []

      lmcacheConfig:
        enabled: false

routerSpec:
  enableRouter: true
  replicaCount: 1
  serviceType: ClusterIP
  servicePort: 80
  routingLogic: "prefixaware"
  serviceDiscovery: "k8s"
  resources:
    requests:
      cpu: "500m"
      memory: "768Mi"
    limits:
      memory: "768Mi"
  # Router image (lmcache/lmstack-router:latest, ~5.3 GiB Python) imports
  # under CPU throttling need ~30–60s before uvicorn binds :8000. Chart
  # defaults (5s + 3×5s = 20s) SIGKILL silently before then.
  # 15s + 18×10s = 195s tolerates cold-image starts comfortably.
  startupProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 18
    httpGet:
      path: /health
      port: router-port

# Deploy the chart's bundled Grafana dashboards as ConfigMaps labeled
# `grafana_dashboard: "1"` in this namespace. The cluster's Grafana runs
# a sidecar (configured in the infra repo) to watch every namespace for
# that label, so they appear in the shared Grafana under
# Dashboards → General within a minute of `helm install`.
grafanaDashboards:
  enabled: true
